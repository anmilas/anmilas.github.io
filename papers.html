const list=document.getElementById('list'),q=document.getElementById('q'),cnt=document.getElementById('count');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function links(p){
  const L=[];
  if(p.ax)L.push(`<a href="https://arxiv.org/abs/${esc(p.ax)}">arXiv</a>`);
  if(p.doi)L.push(`<a href="https://doi.org/${esc(p.doi)}">DOI</a>`);
  if(p.pdf)L.push(`<a href="${esc(p.pdf)}">PDF</a>`);
  if(p.url)L.push(`<a href="${esc(p.url)}">${esc(p.ul||'Link')}</a>`);
  return L.join('');
}
function render(){
  const f=q.value.trim().toLowerCase(),N=P.length;let shown=0;
  list.innerHTML=P.map((p,i)=>{
    const txt=(p.t+' '+p.a+' '+p.v).toLowerCase();
    if(f&&!txt.includes(f))return'';
    shown++;
    return `<li><span class="n">${N-i}.</span><div><span class="t">${esc(p.t)}</span><span class="a">${esc(p.a)}</span><span class="v">${esc(p.v)}</span><span class="l">${links(p)}</span></div></li>`;
  }).join('');
  cnt.textContent=shown+' of '+N+' items';
}
q.addEventListener('input',render);render();
